name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Dummy values so the pydantic config validates in CI. Nothing connects to
    # Snowflake here; only the data-generation and modeling logic is exercised.
    env:
      SNOWFLAKE_ACCOUNT: ci-account
      SNOWFLAKE_USER: ci-user
      SNOWFLAKE_PASSWORD: ci-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check src tests --select E9,F63,F7,F82

      - name: Unit tests
        run: pytest tests -q
