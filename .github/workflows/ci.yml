name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt ruff==0.16.10

      - name: Lint
        run: ruff check src tests

      - name: Generator tests
        run: pytest tests -q

      - name: Generate data
        run: |
          python src/generate_ga4.py
          python src/generate_campaigns.py
          python src/generate_impressions.py

      - name: dbt build on DuckDB
        working-directory: dbt/attributions
        run: |
          dbt deps
          dbt build --profiles-dir . --target local

      - name: Marts match the committed Snowflake exports
        run: python src/export_marts.py --target local --check
