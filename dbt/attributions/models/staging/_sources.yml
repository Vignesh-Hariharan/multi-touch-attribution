version: 2

sources:
  - name: raw
    description: Generated CSVs loaded as VARCHAR by src/load_snowflake.py.
    schema: raw
    meta:
      # Read by the duckdb (local) target only; Snowflake reads the raw schema.
      external_location: "read_csv('../../data/{name}.csv', header = true, all_varchar = true)"

    tables:
      - name: ga4_events
        description: GA4-style event export, one row per event.
      - name: campaigns
        description: Campaign metadata, one row per campaign.
      - name: impressions
        description: Ad impressions served to site users, viewable or not.
